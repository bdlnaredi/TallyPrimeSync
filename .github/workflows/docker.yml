name: Build server image
on:
  push:
    branches: [main]
    paths: ["server/**", "agent/**", "deploy/**", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64 too: Oracle Cloud's always-free servers are ARM
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/tallyprimesync:latest
            ghcr.io/${{ github.repository_owner }}/tallyprimesync:${{ github.sha }}
